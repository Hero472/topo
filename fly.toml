# fly.toml app configuration file generated for topo on 2026-09-27T14:25:30Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'topo'
primary_region = 'gru'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
