[package]
name = "topo"
version = "0.1.0"
edition = "2024"

[dependencies]
cargo-smith = { path = "../cargo-smith" }
actix-web = "4.4"
actix-ws = "0.4"
actix-rt = "2"
tokio = { version = "1.0", features = ["full", "sync", "macros", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.22", features = ["v4"] }
rand = "0.10.0"
mongodb = "3.5.2"
dotenvy = "0.15.7"
env_logger = "0.11.9"
log = "0.4"
futures-util = "0.3.32"
actix-cors = "0.7"

[lib]
name = "topo"
path = "src/lib.rs"
